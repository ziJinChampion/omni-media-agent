<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="es-line" x1="40" y1="40" x2="280" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="es-sweep" x1="160" y1="120" x2="248" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- concentric radar rings -->
  <circle cx="160" cy="120" r="86" stroke="url(#es-line)" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="160" cy="120" r="60" stroke="url(#es-line)" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 6"/>
  <circle cx="160" cy="120" r="34" stroke="url(#es-line)" stroke-opacity="0.32" stroke-width="1"/>
  <!-- cross hairs -->
  <path d="M160 22v196M62 120h196" stroke="url(#es-line)" stroke-opacity="0.12" stroke-width="1"/>
  <!-- sweep wedge -->
  <path d="M160 120 246 62A86 86 0 0 1 236 176Z" fill="url(#es-sweep)"/>
  <path d="M160 120 246 62" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round"/>
  <!-- blips -->
  <circle cx="206" cy="92" r="3" fill="#7C5CFF" opacity="0.9"/>
  <circle cx="206" cy="92" r="7" fill="none" stroke="#7C5CFF" stroke-opacity="0.4"/>
  <circle cx="118" cy="152" r="2.4" fill="#22D3EE" opacity="0.85"/>
  <circle cx="196" cy="166" r="2" fill="#8B94A7" opacity="0.6"/>
  <!-- center hollow ring -->
  <circle cx="160" cy="120" r="11" stroke="url(#es-line)" stroke-width="1.6"/>
  <circle cx="160" cy="120" r="2.6" fill="#E8ECF4" opacity="0.9"/>
</svg>
